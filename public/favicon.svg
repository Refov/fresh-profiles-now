<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .blue-fill { fill: #2563eb; }
      .orange-fill { fill: #f97316; }
      .blue-stroke { stroke: #2563eb; }
      .orange-stroke { stroke: #f97316; }
    </style>
  </defs>

  <!-- Arcs connecting the nodes -->
  <path d="M 50 20 Q 65 15 78 41" class="blue-stroke" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 78 41 Q 85 57.5 67 74" class="orange-stroke" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 67 74 Q 50 85 33 74" class="blue-stroke" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 33 74 Q 15 57.5 22 41" class="blue-stroke" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 22 41 Q 35 15 50 20" class="orange-stroke" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Nodes (circles) -->
  <circle cx="50" cy="20" r="8" class="blue-fill"/>
  <circle cx="78" cy="41" r="8" class="orange-fill"/>
  <circle cx="67" cy="74" r="8" class="blue-fill"/>
  <circle cx="33" cy="74" r="8" class="blue-fill"/>
  <circle cx="22" cy="41" r="8" class="orange-fill"/>
</svg>
