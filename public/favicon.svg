<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .blue { fill: #2563eb; }
      .orange { fill: #f97316; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#1e40af"/>
  
  <!-- Central pentagon with nodes and arcs -->
  <!-- Blue circles -->
  <circle cx="50" cy="20" r="8" class="blue"/>
  <circle cx="80" cy="50" r="8" class="blue"/>
  <circle cx="50" cy="80" r="8" class="blue"/>
  
  <!-- Orange circles -->
  <circle cx="20" cy="50" r="8" class="orange"/>
  <circle cx="65" cy="35" r="8" class="orange"/>
  
  <!-- Blue arcs -->
  <path d="M 50 20 Q 65 35 80 50" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 80 50 Q 65 65 50 80" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 50 80 Q 35 65 20 50" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Orange arcs -->
  <path d="M 20 50 Q 35 35 50 20" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 50 20 Q 35 50 20 50" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
