name: Deploy to hostcreators.sk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to hostcreators.sk
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOSTCREATORS_HOST }}
        username: ${{ secrets.HOSTCREATORS_USERNAME }}
        key: ${{ secrets.HOSTCREATORS_SSH_KEY }}
        port: ${{ secrets.HOSTCREATORS_PORT }}
        script: |
          # Navigate to your domain directory
          cd /path/to/your/domain/public_html
          
          # Remove old files (except .htaccess if you want to keep it)
          rm -rf assets/ index.html favicon.ico placeholder.svg robots.txt
          
          # Create backup of current deployment
          mkdir -p backups/$(date +%Y%m%d_%H%M%S)
          cp -r * backups/$(date +%Y%m%d_%H%M%S)/ 2>/dev/null || true
          
    - name: Upload files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOSTCREATORS_HOST }}
        username: ${{ secrets.HOSTCREATORS_USERNAME }}
        key: ${{ secrets.HOSTCREATORS_SSH_KEY }}
        port: ${{ secrets.HOSTCREATORS_PORT }}
        source: "dist/*"
        target: "/path/to/your/domain/public_html"
        strip_components: 1
        
    - name: Set permissions
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOSTCREATORS_HOST }}
        username: ${{ secrets.HOSTCREATORS_USERNAME }}
        key: ${{ secrets.HOSTCREATORS_SSH_KEY }}
        port: ${{ secrets.HOSTCREATORS_PORT }}
        script: |
          cd /path/to/your/domain/public_html
          chmod -R 755 .
          chmod 644 .htaccess
