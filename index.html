<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Find Your Next Job or Hire - Fresh Profiles Now</title>
    <meta name="title" content="Find Your Next Job or Hire - Fresh Profiles Now" />
    <meta name="description" content="Connect job seekers with employers. Post your profile in 60 seconds or browse fresh candidates. No accounts required. Profiles updated every 30 days." />
    <meta name="keywords" content="job search, hiring, candidates, job seekers, employment, recruitment, careers, jobs, talent, workforce" />
    <meta name="author" content="Refov" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://refov.com" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://refov.com" />
    <meta property="og:title" content="Find Your Next Job or Hire - Fresh Profiles Now" />
    <meta property="og:description" content="Connect job seekers with employers. Post your profile in 60 seconds or browse fresh candidates. No accounts required." />
    <meta property="og:image" content="https://refov.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Fresh Profiles Now" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://refov.com" />
    <meta name="twitter:title" content="Find Your Next Job or Hire - Fresh Profiles Now" />
    <meta name="twitter:description" content="Connect job seekers with employers. Post your profile in 60 seconds or browse fresh candidates. No accounts required." />
    <meta name="twitter:image" content="https://refov.com/og-image.png" />
    <meta name="twitter:site" content="@refov" />
    <meta name="twitter:creator" content="@refov" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="application-name" content="Fresh Profiles Now" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fresh Profiles Now",
      "url": "https://refov.com",
      "description": "Connect job seekers with employers. Post your profile in 60 seconds or browse fresh candidates.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://refov.com/candidates?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
