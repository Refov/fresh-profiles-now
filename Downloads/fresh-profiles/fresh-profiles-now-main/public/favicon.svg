<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .blue { fill: #2563eb; }
      .orange { fill: #f97316; }
    </style>
  </defs>
  
  <!-- Nodes -->
  <!-- Blue circles -->
  <circle cx="50" cy="20" r="8" class="blue"/> <!-- Top Blue -->
  <circle cx="30" cy="75" r="8" class="blue"/> <!-- Bottom-Left Blue -->
  <circle cx="70" cy="75" r="8" class="blue"/> <!-- Bottom-Right Blue -->
  
  <!-- Orange circles -->
  <circle cx="20" cy="40" r="8" class="orange"/> <!-- Top-Left Orange -->
  <circle cx="80" cy="40" r="8" class="orange"/> <!-- Top-Right Orange -->
  
  <!-- Arcs -->
  <!-- Top-Left Orange to Top Blue (Orange Arc) -->
  <path d="M 20 40 Q 35 25 50 20" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Top Blue to Top-Right Orange (Blue Arc) -->
  <path d="M 50 20 Q 65 25 80 40" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Top-Right Orange to Bottom-Right Blue (Orange Arc) -->
  <path d="M 80 40 Q 75 60 70 75" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Bottom-Right Blue to Bottom-Left Blue (Blue Arc) -->
  <path d="M 70 75 Q 50 85 30 75" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Bottom-Left Blue to Top-Left Orange (Blue Arc) -->
  <path d="M 30 75 Q 25 55 20 40" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
