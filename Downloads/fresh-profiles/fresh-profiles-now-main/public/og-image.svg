<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" style="background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);">
  <!-- Background Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Grid Background -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main Icon (Larger) -->
  <g transform="translate(100, 165)">
    <!-- Arcs -->
    <path d="M 200 50 Q 250 25 300 100" stroke="#f97316" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M 300 100 Q 325 150 250 200" stroke="#f97316" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M 250 200 Q 200 225 150 200" stroke="#2563eb" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M 150 200 Q 125 150 200 100" stroke="#2563eb" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M 200 100 Q 175 75 200 50" stroke="#2563eb" stroke-width="15" fill="none" stroke-linecap="round"/>
    
    <!-- Nodes -->
    <circle cx="200" cy="50" r="20" fill="#2563eb"/>
    <circle cx="300" cy="100" r="20" fill="#f97316"/>
    <circle cx="250" cy="200" r="20" fill="#2563eb"/>
    <circle cx="150" cy="200" r="20" fill="#2563eb"/>
    <circle cx="200" cy="100" r="20" fill="#f97316"/>
  </g>
  
  <!-- Text Content -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">
    Fresh Profiles Now
  </text>
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Find Your Next Job or Hire
  </text>
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    Connect job seekers with employers • No accounts required
  </text>
  
  <!-- URL -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)" text-anchor="middle">
    refov.com
  </text>
</svg>
